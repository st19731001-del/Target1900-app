<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ターゲット1900 テスト</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>ターゲット1900 テスト</h1>
      <p class="subtitle">自動データ読み込み対応</p>
    </header>

    <!-- 設定画面 -->
    <section id="setupSection" class="card">
      <div class="user-info-group">
        <label for="userNameInput">プレイヤー名:</label>
        <input type="text" id="userNameInput" placeholder="名前を入力（任意）" maxlength="10">
      </div>

      <div class="tabs">
        <button id="tabNormal" class="tab-btn active">通常モード</button>
        <button id="tabSurvival" class="tab-btn">サバイバルモード</button>
      </div>

      <div class="mode-description">
        <p id="bestRecordText" class="best-record">🏆 最高記録: 0 点</p>
      </div>

      <!-- 出題方向の設定 -->
      <div class="setting-group">
        <label>出題モード:</label>
        <div class="radio-group">
          <label><input type="radio" name="direction" value="en-ja" checked> 英 → 日（単語から意味）</label>
          <label><input type="radio" name="direction" value="ja-en"> 日 → 英（意味から単語）</label>
        </div>
      </div>

      <!-- 自動発音の設定 -->
      <div class="setting-group">
        <label class="checkbox-label">
          <input type="checkbox" id="autoSpeechCheck" checked>
          <span>問題表示時に自動で発音する（英語）</span>
        </label>
      </div>

      <div id="normalOptions">
        <div class="setting-group">
          <label for="rangeSelect">出題範囲:</label>
          <select id="rangeSelect">
            <option value="all">全範囲 (1-1900)</option>
            <option value="1-100">1 - 100（必修）</option>
            <option value="101-300">101 - 300（必修）</option>
            <option value="301-800">301 - 800（必修）</option>
            <option value="801-1500">801 - 1500（標準）</option>
            <option value="1501-1900">1501 - 1900（応用）</option>
            <option value="custom">カスタム範囲指定</option>
          </select>
        </div>

        <div id="customRangeGroup" class="setting-group hidden inline-inputs">
          <input type="number" id="startNum" placeholder="開始 (例: 1)" min="1" max="1900">
          <span>〜</span>
          <input type="number" id="endNum" placeholder="終了 (例: 50)" min="1" max="1900">
        </div>

        <div class="setting-group">
          <label for="questionCount">出題数:</label>
          <select id="questionCount">
            <option value="10">10 問</option>
            <option value="20" selected>20 問</option>
            <option value="50">50 問</option>
            <option value="100">100 問</option>
            <option value="custom">カスタム数指定</option>
          </select>
        </div>

        <div id="customCountGroup" class="setting-group hidden">
          <input type="number" id="customQuestionCount" placeholder="出題数を入力 (例: 15)" min="1" max="1900">
        </div>
      </div>

      <div class="action-area">
        <button id="startBtn" class="primary-btn">テスト開始！</button>
        <button id="hardBtn" class="hard-btn hidden">🔥 ハードモード全範囲で開始！</button>
      </div>
    </section>

    <!-- クイズ画面 -->
    <section id="quizSection" class="card hidden">
      <div class="quiz-header">
        <button id="cancelBtn" class="cancel-btn">✕ 中止</button>
        <span id="questionNumText" class="q-num">第 1 問 / 20 問</span>
        <span id="wordIdText" class="word-id">No. 1</span>
      </div>

      <div class="progress-container">
        <div id="progressBar" class="progress-bar"></div>
      </div>

      <div class="word-card">
        <div class="word-speech-wrapper">
          <h2 id="wordTitle" class="word-title">word</h2>
          <button id="speechBtn" class="speech-btn" type="button" title="音声再生">🔊</button>
        </div>
      </div>

      <div id="optionsGrid" class="options-grid"></div>
    </section>

    <!-- 結果画面 -->
    <section id="resultSection" class="card hidden">
      <h2>結果発表</h2>
      <div class="result-badge" id="badgeDisplay">通常モード</div>
      <div class="score-box">
        <span class="score-label">SCORE</span>
        <span id="scoreDisplay" class="score-val">0 / 20</span>
      </div>
      <p id="scoreMessage" class="score-msg">お疲れ様でした！</p>

      <div class="result-actions">
        <button id="retryWrongBtn" class="secondary-btn hidden">🔄 間違えた問題のみ再挑戦</button>
        <button id="restartBtn" class="primary-btn">🔁 もう一度同じ条件で挑戦</button>
        <button id="backToHomeBtn" class="outline-btn">🏠 設定画面に戻る</button>
        <button id="lineShareBtn" class="line-btn">💬 LINEで結果をシェア</button>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
