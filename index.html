<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ターゲット1900 英単語テスト</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --primary-color: #3b82f6;
      --primary-hover: #2563eb;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #1e293b;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --success-color: #22c55e;
      --error-color: #ef4444;
      --hard-color: #dc2626;
      --line-color: #06c755;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background-color: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      padding: 20px;
      margin-top: 10px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.4rem;
      color: var(--text-color);
      margin-bottom: 4px;
    }

    p.subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .setup-section, .quiz-section, .result-section {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .hidden {
      display: none !important;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--text-color);
    }

    input[type="text"], input[type="number"], select {
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }

    .mode-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: 1px solid var(--border-color);
      background: #f1f5f9;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
      text-align: center;
    }

    .tab-btn.active {
      background: var(--primary-color);
      color: white;
      border-color: var(--primary-color);
    }

    .btn {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      text-align: center;
    }

    .btn-hard {
      background-color: var(--hard-color);
    }

    .btn-retry {
      background-color: #f59e0b;
      color: white;
    }

    .btn-secondary {
      background-color: #e2e8f0;
      color: #334155;
    }

    .btn-line {
      background-color: var(--line-color);
      color: white;
    }

    .btn-cancel {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background-color: #f1f5f9;
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background-color: var(--primary-color);
      width: 0%;
      transition: width 0.3s ease;
    }

    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .card {
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 24px 16px;
      text-align: center;
      background-color: #fafafa;
    }

    .word-title {
      font-size: 1.8rem;
      font-weight: bold;
      color: var(--text-color);
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .option-btn {
      padding: 12px;
      border: 1.5px solid var(--border-color);
      background-color: white;
      border-radius: 8px;
      font-size: 0.95rem;
      text-align: left;
      cursor: pointer;
    }

    .option-btn.correct {
      background-color: #dcfce7 !important;
      border-color: var(--success-color) !important;
      color: #166534;
      font-weight: bold;
    }

    .option-btn.incorrect {
      background-color: #fee2e2 !important;
      border-color: var(--error-color) !important;
      color: #991b1b;
    }

    .result-score {
      text-align: center;
      padding: 16px 0;
    }

    .score-number {
      font-size: 2.8rem;
      font-weight: bold;
      color: var(--primary-color);
    }

    .badge-status {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.8rem;
      background-color: #e2e8f0;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>ターゲット1900 テスト</h1>
      <p class="subtitle">自動データ読み込み対応</p>
    </header>

    <!-- 設定画面 -->
    <div id="setupSection" class="setup-section">
      <div class="form-group">
        <label for="userNameInput">プレイヤー名</label>
        <input type="text" id="userNameInput" placeholder="名前を入力（例: たろう）">
      </div>

      <div class="form-group">
        <label>モード選択</label>
        <div class="mode-tabs">
          <div id="tabNormal" class="tab-btn active">通常テスト</div>
          <div id="tabSurvival" class="tab-btn">サバイバル (1ミス即終了)</div>
        </div>
      </div>

      <div class="form-group">
        <label for="rangeSelect">出題範囲</label>
        <select id="rangeSelect">
          <option value="all">全範囲 (1 - 1900)</option>
          <option value="1-100">1 - 100 常にでる必修単語</option>
          <option value="101-300">101 - 300 常にでる必修単語</option>
          <option value="301-800">301 - 800 常にでる必修単語</option>
          <option value="801-1500">801 - 1500 常にでる標準単語</option>
          <option value="1501-1900">1501 - 1900 応用・発展単語</option>
          <option value="custom">カスタム指定</option>
        </select>
      </div>

      <div id="customRangeGroup" class="form-group hidden">
        <label>カスタム範囲</label>
        <div style="display: flex; gap: 8px; align-items: center;">
          <input type="number" id="startNum" value="1" min="1" max="1900" style="width: 50%;">
          〜
          <input type="number" id="endNum" value="100" min="1" max="1900" style="width: 50%;">
        </div>
      </div>

      <div id="normalOptions" class="form-group">
        <label for="questionCount">出題数</label>
        <select id="questionCount">
          <option value="10">10問</option>
          <option value="20" selected>20問</option>
          <option value="50">50問</option>
          <option value="100">100問</option>
          <option value="custom">任意入力</option>
        </select>
      </div>

      <div id="customCountGroup" class="form-group hidden">
        <label for="customQuestionCount">指定の出題数（半角数字）</label>
        <input type="number" id="customQuestionCount" value="15" min="1" max="1900">
      </div>

      <button id="startBtn" class="btn">テストを開始する</button>
      <button id="hardBtn" class="btn btn-hard hidden">🔥 1900全範囲 ハードサバイバル</button>

      <p id="bestRecordText" style="font-size: 0.8rem; color: var(--text-muted); text-align: center; margin-top: 4px;"></p>
    </div>

    <!-- クイズ画面 -->
    <div id="quizSection" class="quiz-section hidden">
      <div class="quiz-header">
        <button id="cancelBtn" class="btn-cancel">✕ 中止</button>
        <span id="questionNumText">第 1 問</span>
        <span id="wordIdText">No. 1</span>
      </div>

      <div class="progress-bar-container">
        <div id="progressBar" class="progress-bar"></div>
      </div>

      <div class="card">
        <div id="wordTitle" class="word-title">create</div>
      </div>

      <div id="optionsGrid" class="options-grid"></div>
    </div>

    <!-- 結果画面 -->
    <div id="resultSection" class="result-section hidden">
      <div class="result-score">
        <h2 id="resultTitle">結果発表</h2>
        <div id="scoreDisplay" class="score-number">18 / 20</div>
        <div id="badgeDisplay" class="badge-status">ターゲットマスター</div>
        <p id="scoreMessage" style="margin-top: 10px; font-size: 0.9rem; color: var(--text-muted);"></p>
      </div>

      <button id="retryWrongBtn" class="btn btn-retry hidden">🔄 間違えた問題のみ再挑戦 (0問)</button>
      <button id="lineShareBtn" class="btn btn-line">💬 グループLINEに記録を共有</button>
      <button id="restartBtn" class="btn">もう一度最初から挑戦</button>
      <button id="backToHomeBtn" class="btn btn-secondary">設定に戻る</button>
    </div>
  </div>

  <script>
    let wordDatabase = [
      { id: 1, word: "create", meaning: "〜を創り出す、引き起こす" },
      { id: 2, word: "increase", meaning: "増加する、〜を増やす" },
      { id: 3, word: "improve", meaning: "〜を向上させる、改善する" },
      { id: 4, word: "provide", meaning: "〜を供給する、与える" },
      { id: 5, word: "consider", meaning: "〜を考慮する、〜とみなす" }
    ];

    let currentMode = "normal";
    let currentQuizList = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let isAnswering = false;
    let rangeLabel = "全範囲 (1-1900)";
    let wrongWordsList = []; // 間違えた単語リスト

    // CSV自動読み込み
    window.addEventListener("DOMContentLoaded", () => {
      fetch("target1900.csv")
        .then(response => {
          if (!response.ok) throw new Error("CSV not found");
          return response.text();
        })
        .then(text => {
          const lines = text.split(/\r\n|\n/);
          const parsedData = [];
          lines.forEach((line, idx) => {
            if (!line.trim()) return;
            const cols = line.split(",");
            if (cols.length >= 2) {
              let id = idx + 1;
              let word = cols[0].replace(/^"|"$/g, '').trim();
              let meaning = cols[1].replace(/^"|"$/g, '').trim();
              if (!isNaN(parseInt(cols[0])) && cols.length >= 3) {
                id = parseInt(cols[0]);
                word = cols[1].replace(/^"|"$/g, '').trim();
                meaning = cols[2].replace(/^"|"$/g, '').trim();
              }
              parsedData.push({ id, word, meaning });
            }
          });
          if (parsedData.length > 0) {
            wordDatabase = parsedData;
          }
        })
        .catch(err => console.log("Using fallback database"));

      const savedName = localStorage.getItem("target_userName");
      if (savedName) document.getElementById("userNameInput").value = savedName;
      updateBestRecordText();
    });

    function playFanfare() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioContext();
        const notes = [261.63, 329.63, 392.00, 523.25];
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "triangle";
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.1, ctx.currentTime + idx * 0.12);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.12 + 0.3);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + idx * 0.12);
          osc.stop(ctx.currentTime + idx * 0.12 + 0.3);
        });
      } catch(e){}
    }

    const tabNormal = document.getElementById("tabNormal");
    const tabSurvival = document.getElementById("tabSurvival");
    const normalOptions = document.getElementById("normalOptions");
    const startBtn = document.getElementById("startBtn");
    const hardBtn = document.getElementById("hardBtn");
    const rangeSelect = document.getElementById("rangeSelect");
    const customRangeGroup = document.getElementById("customRangeGroup");
    const questionCountSelect = document.getElementById("questionCount");
    const customCountGroup = document.getElementById("customCountGroup");

    tabNormal.addEventListener("click", () => {
      currentMode = "normal";
      tabNormal.classList.add("active");
      tabSurvival.classList.remove("active");
      normalOptions.classList.remove("hidden");
      if (questionCountSelect.value === "custom") customCountGroup.classList.remove("hidden");
      hardBtn.classList.add("hidden");
      updateBestRecordText();
    });

    tabSurvival.addEventListener("click", () => {
      currentMode = "survival";
      tabSurvival.classList.add("active");
      tabNormal.classList.remove("active");
      normalOptions.classList.add("hidden");
      customCountGroup.classList.add("hidden");
      hardBtn.classList.remove("hidden");
      updateBestRecordText();
    });

    rangeSelect.addEventListener("change", () => {
      if (rangeSelect.value === "custom") {
        customRangeGroup.classList.remove("hidden");
      } else {
        customRangeGroup.classList.add("hidden");
      }
    });

    questionCountSelect.addEventListener("change", () => {
      if (questionCountSelect.value === "custom") {
        customCountGroup.classList.remove("hidden");
      } else {
        customCountGroup.classList.add("hidden");
      }
    });

    function updateBestRecordText() {
      const best = localStorage.getItem(`target_best_${currentMode}`) || 0;
      const el = document.getElementById("bestRecordText");
      if (currentMode === "survival") {
        el.textContent = `🏆 サバイバル最高連勝記録: ${best} 問`;
      } else {
        el.textContent = `🏆 通常モード最高スコア: ${best} 点`;
      }
    }

    startBtn.addEventListener("click", () => startQuiz(false));
    hardBtn.addEventListener("click", () => startQuiz(true));

    // テスト中止ボタン
    document.getElementById("cancelBtn").addEventListener("click", () => {
      if (confirm("テストを中止して設定画面に戻りますか？")) {
        document.getElementById("quizSection").classList.add("hidden");
        document.getElementById("setupSection").classList.remove("hidden");
      }
    });

    function startQuiz(isHard) {
      const userName = document.getElementById("userNameInput").value.trim() || "ゲスト";
      localStorage.setItem("target_userName", userName);
      wrongWordsList = []; // 初期化

      let minId = 1; maxId = 1900;
      if (isHard) {
        rangeLabel = "1900語 ハード全範囲";
      } else {
        const rangeVal = rangeSelect.value;
        if (rangeVal === "1-100") { minId = 1; maxId = 100; rangeLabel = "1-100 必修"; }
        else if (rangeVal === "101-300") { minId = 101; maxId = 300; rangeLabel = "101-300 必修"; }
        else if (rangeVal === "301-800") { minId = 301; maxId = 800; rangeLabel = "301-800 必修"; }
        else if (rangeVal === "801-1500") { minId = 801; maxId = 1500; rangeLabel = "801-1500 標準"; }
        else if (rangeVal === "1501-1900") { minId = 1501; maxId = 1900; rangeLabel = "1501-1900 応用"; }
        else if (rangeVal === "custom") {
          minId = parseInt(document.getElementById("startNum").value) || 1;
          maxId = parseInt(document.getElementById("endNum").value) || 1900;
          rangeLabel = `カスタム (${minId}-${maxId})`;
        } else {
          rangeLabel = "全範囲 (1-1900)";
        }
      }

      let filtered = wordDatabase.filter(w => w.id >= minId && w.id <= maxId);
      if (filtered.length === 0) filtered = wordDatabase;

      currentQuizList = [...filtered].sort(() => 0.5 - Math.random());
      
      if (currentMode === "normal") {
        let requestedCount = 20;
        if (questionCountSelect.value === "custom") {
          requestedCount = parseInt(document.getElementById("customQuestionCount").value) || 10;
        } else {
          requestedCount = parseInt(questionCountSelect.value) || 20;
        }
        const finalCount = Math.min(requestedCount, currentQuizList.length);
        currentQuizList = currentQuizList.slice(0, finalCount);
      }

      currentQuestionIndex = 0;
      score = 0;

      document.getElementById("setupSection").classList.add("hidden");
      document.getElementById("resultSection").classList.add("hidden");
      document.getElementById("quizSection").classList.remove("hidden");

      showQuestion();
    }

    function showQuestion() {
      isAnswering = false;
      const q = currentQuizList[currentQuestionIndex];
      const totalQ = currentQuizList.length;

      document.getElementById("progressBar").style.width = currentMode === "normal" 
        ? `${(currentQuestionIndex / totalQ) * 100}%` 
        : `100%`;

      document.getElementById("questionNumText").textContent = currentMode === "normal"
        ? `第 ${currentQuestionIndex + 1} 問 / ${totalQ} 問`
        : `連続 ${currentQuestionIndex + 1} 問目`;

      document.getElementById("wordIdText").textContent = `No. ${q.id}`;
      document.getElementById("wordTitle").textContent = q.word;

      const grid = document.getElementById("optionsGrid");
      grid.innerHTML = "";

      let otherMeanings = wordDatabase
        .filter(w => w.meaning !== q.meaning)
        .map(w => w.meaning)
        .sort(() => 0.5 - Math.random())
        .slice(0, 3);

      const options = [q.meaning, ...otherMeanings].sort(() => 0.5 - Math.random());

      options.forEach(optText => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.textContent = optText;
        btn.addEventListener("click", () => handleAnswer(optText, q.meaning, btn, q));
        grid.appendChild(btn);
      });
    }

    function handleAnswer(selected, correct, selectedBtn, wordObj) {
      if (isAnswering) return;
      isAnswering = true;

      const buttons = document.querySelectorAll(".option-btn");
      const isCorrect = (selected === correct);

      if (isCorrect) {
        score++;
        selectedBtn.classList.add("correct");
      } else {
        selectedBtn.classList.add("incorrect");
        wrongWordsList.push(wordObj); // 間違えた単語を記録
        buttons.forEach(btn => {
          if (btn.textContent === correct) btn.classList.add("correct");
        });
      }

      setTimeout(() => {
        if (currentMode === "survival" && !isCorrect) {
          showResult(true);
        } else {
          currentQuestionIndex++;
          if (currentQuestionIndex < currentQuizList.length) {
            showQuestion();
          } else {
            showResult(false);
          }
        }
      }, 1200);
    }

    function showResult(isGameOver) {
      document.getElementById("quizSection").classList.add("hidden");
      document.getElementById("resultSection").classList.remove("hidden");

      const userName = localStorage.getItem("target_userName") || "ゲスト";
      const scoreDisplay = document.getElementById("scoreDisplay");
      const scoreMessage = document.getElementById("scoreMessage");
      const badgeDisplay = document.getElementById("badgeDisplay");
      const retryWrongBtn = document.getElementById("retryWrongBtn");

      let isPerfect = false;

      if (currentMode === "normal") {
        const total = currentQuizList.length;
        scoreDisplay.textContent = `${score} / ${total}`;
        badgeDisplay.textContent = `通常モード [${rangeLabel}]`;
        if (score === total) {
          isPerfect = true;
          scoreMessage.textContent = "全問正解！素晴らしい成果です！🎉";
        } else {
          scoreMessage.textContent = "復習して何度も挑戦しよう！💪";
        }

        const prevBest = parseInt(localStorage.getItem("target_best_normal") || "0");
        if (score > prevBest) localStorage.setItem("target_best_normal", score);

      } else {
        scoreDisplay.textContent = `${score} 問連続正解`;
        badgeDisplay.textContent = `サバイバル [${rangeLabel}]`;
        scoreMessage.textContent = isGameOver ? "ここでストップ！記録更新を目指そう！🔥" : "スゴい！最後まで完走！👑";

        if (score > 0) isPerfect = true;

        const prevBest = parseInt(local
